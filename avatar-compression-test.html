<!doctype html>
<html>
  <body>
    <output id="result">running</output>
    <script type="module">
      import { compressImage } from '/src/utils/compressImage.ts';

      const canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = 600;
      const context = canvas.getContext('2d');
      const pixels = context.createImageData(canvas.width, canvas.height);
      for (let offset = 0; offset < pixels.data.length; offset += 65536) {
        crypto.getRandomValues(pixels.data.subarray(offset, Math.min(offset + 65536, pixels.data.length)));
      }
      for (let index = 3; index < pixels.data.length; index += 4) pixels.data[index] = 255;
      context.putImageData(pixels, 0, 0);
      const source = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
      const avatar = await compressImage(source);
      const image = new Image();
      image.src = avatar;
      await image.decode();
      const bytes = new TextEncoder().encode(avatar).length;
      document.querySelector('#result').textContent = JSON.stringify({
        bytes,
        width: image.naturalWidth,
        height: image.naturalHeight,
        type: avatar.slice(5, avatar.indexOf(';')),
        passed: bytes < 35 * 1024 && image.naturalWidth === 256 && image.naturalHeight === 256,
      });
    </script>
  </body>
</html>
